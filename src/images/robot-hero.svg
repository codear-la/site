<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background with blurred circles and floating elements -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#13b1a4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144265" />
      <stop offset="100%" stop-color="#0b2b48" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="400" height="400" fill="none" />
  <circle cx="200" cy="200" r="180" fill="url(#glow)" />

  <!-- Floating background particles and gears -->
  <g opacity="0.3">
    <!-- Decorative circles -->
    <circle cx="80" cy="100" r="8" fill="#f59e0b" />
    <circle cx="340" cy="220" r="12" fill="#13b1a4" />
    <circle cx="300" cy="80" r="6" fill="#144265" />
    <circle cx="90" cy="300" r="15" fill="#f59e0b" />

    <!-- Small decorative gear -->
    <g transform="translate(320, 120)">
      <circle cx="0" cy="0" r="8" fill="none" stroke="#13b1a4" stroke-width="4" />
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#13b1a4" stroke-width="3" />
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#13b1a4" stroke-width="3" />
    </g>
    
    <!-- Floating code symbols -->
    <text x="60" y="200" font-family="Courier, monospace" font-size="28" font-weight="bold" fill="#13b1a4">{ }</text>
    <text x="290" y="290" font-family="Courier, monospace" font-size="24" font-weight="bold" fill="#144265">&lt;/&gt;</text>
  </g>

  <!-- Main Robot in the Center -->
  <g transform="translate(100, 80)">
    <!-- Robot Arms -->
    <!-- Left arm waving -->
    <path d="M 20,110 C 5,90 -5,70 5,60 C 12,52 25,65 30,85" fill="none" stroke="#144265" stroke-width="8" stroke-linecap="round" />
    <circle cx="5" cy="58" r="7" fill="#f59e0b" />

    <!-- Right arm holding a block -->
    <path d="M 180,110 C 195,110 205,120 200,135" fill="none" stroke="#144265" stroke-width="8" stroke-linecap="round" />
    <circle cx="201" cy="138" r="7" fill="#f59e0b" />

    <!-- Robot Body (Large Gear) -->
    <g id="main-body" transform="translate(100, 130)">
      <!-- Movement base/tread -->
      <rect x="-40" y="55" width="80" height="18" rx="9" fill="#144265" />
      <rect x="-30" y="58" width="60" height="12" rx="6" fill="#13b1a4" />
      <circle cx="-20" cy="64" r="4" fill="#ffffff" />
      <circle cx="0" cy="64" r="4" fill="#ffffff" />
      <circle cx="20" cy="64" r="4" fill="#ffffff" />
      
      <!-- Central support -->
      <rect x="-10" y="10" width="20" height="50" fill="#144265" />

      <!-- Body Orange Gear -->
      <g>
        <rect x="-10" y="-35" width="20" height="70" rx="4" fill="#f59e0b" />
        <rect x="-10" y="-35" width="20" height="70" rx="4" fill="#f59e0b" transform="rotate(30)" />
        <rect x="-10" y="-35" width="20" height="70" rx="4" fill="#f59e0b" transform="rotate(60)" />
        <rect x="-10" y="-35" width="20" height="70" rx="4" fill="#f59e0b" transform="rotate(90)" />
        <rect x="-10" y="-35" width="20" height="70" rx="4" fill="#f59e0b" transform="rotate(120)" />
        <rect x="-10" y="-35" width="20" height="70" rx="4" fill="#f59e0b" transform="rotate(150)" />
        <circle cx="0" cy="0" r="26" fill="#f59e0b" />
        <circle cx="0" cy="0" r="14" fill="#ffffff" />
        <circle cx="0" cy="0" r="8" fill="#144265" />
      </g>
    </g>

    <!-- Neck -->
    <rect x="92" y="88" width="16" height="15" fill="#144265" rx="3" />

    <!-- Robot Head -->
    <g transform="translate(60, 25)">
      <!-- Ears -->
      <rect x="-8" y="20" width="8" height="24" rx="4" fill="#f59e0b" />
      <rect x="80" y="20" width="8" height="24" rx="4" fill="#f59e0b" />
      
      <!-- Antenna -->
      <line x1="40" y1="4" x2="40" y2="-12" stroke="#144265" stroke-width="6" stroke-linecap="round" />
      <circle cx="40" cy="-18" r="10" fill="#f59e0b" />
      
      <!-- Head Structure -->
      <rect x="0" y="0" width="80" height="60" rx="18" fill="#ffffff" stroke="#144265" stroke-width="8" />
      
      <!-- Internal face screen -->
      <rect x="10" y="10" width="60" height="40" rx="10" fill="#0b2b48" />

      <!-- Bright eyes (Teal) -->
      <ellipse cx="25" cy="30" rx="7" ry="10" fill="#13b1a4" />
      <ellipse cx="55" cy="30" rx="7" ry="10" fill="#13b1a4" />
      
      <!-- Eye highlights (Cute) -->
      <circle cx="27" cy="27" r="2.5" fill="#ffffff" />
      <circle cx="57" cy="27" r="2.5" fill="#ffffff" />
    </g>
  </g>

  <!-- Scratch-style floating code block held by the robot -->
  <g transform="translate(230, 220)">
    <!-- Control block -->
    <path d="M 0,0 L 80,0 L 85,5 L 95,5 L 100,0 L 110,0 A 8,8 0 0 1 118,8 L 118,32 A 8,8 0 0 1 110,40 L 40,40 L 35,45 L 25,45 L 20,40 L 8,40 A 8,8 0 0 1 0,32 Z" fill="#f59e0b" />
    <text x="12" y="25" font-family="'Outfit', sans-serif" font-weight="bold" font-size="13" fill="#ffffff">repeat 10</text>
    
    <!-- Nested block -->
    <g transform="translate(10, 48)">
      <path d="M 0,0 L 70,0 L 75,5 L 85,5 L 90,0 L 100,0 A 6,6 0 0 1 106,6 L 106,26 A 6,6 0 0 1 100,32 L 30,32 L 25,37 L 15,37 L 10,32 L 6,32 A 6,6 0 0 1 0,26 Z" fill="#13b1a4" />
      <text x="10" y="20" font-family="'Outfit', sans-serif" font-weight="bold" font-size="11" fill="#ffffff">move (10)</text>
    </g>
  </g>

  <!-- Command console with educational text -->
  <g transform="translate(40, 280)">
    <rect x="0" y="0" width="160" height="70" rx="8" fill="url(#codeGrad)" stroke="#13b1a4" stroke-width="2" />
    <!-- Window control circles -->
    <circle cx="15" cy="15" r="4" fill="#ff5f56" />
    <circle cx="27" cy="15" r="4" fill="#ffbd2e" />
    <circle cx="39" cy="15" r="4" fill="#27c93f" />
    
    <text x="15" y="38" font-family="Courier, monospace" font-size="11" fill="#13b1a4">robot.conectar()</text>
    <text x="15" y="54" font-family="Courier, monospace" font-size="11" fill="#ffffff">robot.escribir("¡Hola!")</text>
  </g>
</svg>
